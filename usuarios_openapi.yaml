openapi: '3.0.3'
info:
  title: LABORA - Servicio de Usuarios
  version: '1.0'
  description: Contrato REST para la gestión de usuarios demandantes en el sistema LABORA.

paths:

  /usuarios:
    post:
      tags:
        - usuarios
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Los datos introducidos son incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe un usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    get:
      tags:
        - usuarios
      summary: Listar usuarios con filtros opcionales
      parameters:
        - name: p
          in: query
          description: Número de página
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: s
          in: query
          description: Número de entradas por página
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: q
          in: query
          description: Orden por fecha de creación
          schema:
            type: string
            enum: [ascendente, descendente]
            default: descendente
        - name: search
          in: query
          description: Filtrar por nombre, apellidos o email
          schema:
            type: string
        - name: tipo
          in: query
          description: Filtrar por tipo de usuario
          schema:
            type: string
            enum: [DEMANDANTE, REPRESENTANTE, ADMINISTRADOR]
        - name: activo
          in: query
          description: Filtrar por estado activo/inactivo
          schema:
            type: boolean
      responses:
        '200':
          description: Listado de usuarios obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total de resultados encontrados
                  pagina:
                    type: integer
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '500':
          description: Error interno del servidor

  /usuarios/{id}:
    get:
      tags:
        - usuarios
      summary: Obtener un usuario por su NIF/NIE
      parameters:
        - name: id
          in: path
          required: true
          description: NIF o NIE del usuario
          schema:
            type: string
            example: "12345678A"
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          description: No existe ningún usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    put:
      tags:
        - usuarios
      summary: Modificar los datos de un usuario
      parameters:
        - name: id
          in: path
          required: true
          description: NIF o NIE del usuario
          schema:
            type: string
            example: "12345678A"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '200':
          description: Usuario modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Los datos introducidos son incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe ningún usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    delete:
      tags:
        - usuarios
      summary: Eliminar un usuario por su NIF/NIE
      parameters:
        - name: id
          in: path
          required: true
          description: NIF o NIE del usuario
          schema:
            type: string
            example: "12345678A"
      responses:
        '200':
          description: Usuario eliminado correctamente
        '404':
          description: No existe ningún usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

components:
  schemas:

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "No existe ningún usuario con ese NIF/NIE"

    UsuarioInput:
      type: object
      description: Datos necesarios para crear o modificar un usuario
      required:
        - id_nie
        - nombre
        - apellidos
        - email
        - tipo
      properties:
        id_nie:
          type: string
          description: NIF o NIE del usuario (identificador único)
          example: "12345678A"
        nombre:
          type: string
          description: Nombre del usuario
          example: "María"
        apellidos:
          type: string
          description: Apellidos del usuario
          example: "García López"
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: "maria.garcia@email.com"
        tipo:
          type: string
          description: Tipo de usuario en el sistema
          enum: [DEMANDANTE, EMPRESA, ADMIN]
          example: "DEMANDANTE"
        activo:
          type: boolean
          description: Indica si el usuario está activo en el sistema
          default: true

    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioInput'
      description: Usuario completo tal como se almacena en el sistema
