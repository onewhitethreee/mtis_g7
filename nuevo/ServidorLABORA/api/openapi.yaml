components:
  parameters:
    Pagina:
      description: Número de página
      explode: true
      in: query
      name: p
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    TamanoPagina:
      description: Número de entradas por página
      explode: true
      in: query
      name: s
      required: false
      schema:
        default: 10
        maximum: 50
        type: integer
      style: form
    Orden:
      description: Orden de los resultados por fecha
      explode: true
      in: query
      name: q
      required: false
      schema:
        default: descendente
        enum:
        - ascendente
        - descendente
        type: string
      style: form
    IdNIFNIE:
      description: NIF o NIE del usuario
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: 12345678A
        type: string
      style: simple
    IdCIF:
      description: CIF de la empresa
      explode: false
      in: path
      name: cif
      required: true
      schema:
        example: B12345678
        type: string
      style: simple
    IdOferta:
      description: Identificador único de la oferta
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: OFE-2026-001
        type: string
      style: simple
    IdCurso:
      description: Identificador único del curso
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: 1
        type: integer
      style: simple
    IdCandidatura:
      description: Identificador único de la candidatura
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: 1
        type: integer
      style: simple
    IdSuscripcion:
      description: Identificador único de la suscripción
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: 1
        type: integer
      style: simple
    IdNotificacion:
      description: Identificador único de la notificación
      explode: false
      in: path
      name: id
      required: true
      schema:
        example: 10458
        type: integer
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          example:
            mensaje: Los datos introducidos son incorrectos
          schema:
            $ref: "#/components/schemas/Error"
      description: Los datos introducidos son incorrectos
    NotFound:
      content:
        application/json:
          example:
            mensaje: El recurso solicitado no existe
          schema:
            $ref: "#/components/schemas/Error"
      description: El recurso solicitado no existe
    InternalError:
      content:
        application/json:
          example:
            mensaje: Error interno del servidor
          schema:
            $ref: "#/components/schemas/Error"
      description: Error interno del servidor
  schemas:
    Error:
      example:
        mensaje: Descripción del error ocurrido
      properties:
        mensaje:
          example: Descripción del error ocurrido
          type: string
      required:
      - mensaje
      type: object
    UsuarioInput:
      description: Datos necesarios para crear o modificar un usuario
      example:
        apellidos: García López
        tipo: DEMANDANTE
        id_nie: 12345678A
        nombre: María
        email: maria.garcia@email.com
        activo: true
      properties:
        id_nie:
          description: NIF o NIE del usuario (identificador único)
          example: 12345678A
          type: string
        nombre:
          example: María
          type: string
        apellidos:
          example: García López
          type: string
        email:
          example: maria.garcia@email.com
          format: email
          type: string
        tipo:
          enum:
          - DEMANDANTE
          - REPRESENTANTE
          - ADMINISTRADOR
          example: DEMANDANTE
          type: string
        activo:
          default: true
          type: boolean
      required:
      - apellidos
      - email
      - id_nie
      - nombre
      - tipo
      type: object
    UsuarioUpdateInput:
      description: Datos opcionales para actualizar un usuario
      properties:
        id_nie:
          description: NIF o NIE del usuario (identificador único)
          example: 12345678A
          type: string
        nombre:
          example: María
          type: string
        apellidos:
          example: García López
          type: string
        email:
