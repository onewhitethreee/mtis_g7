openapi: 3.0.3
info:
  description: |
    Contrato REST unificado del sistema LABORA (Servicio Público de Empleo de la Comunitat Valenciana). Incluye la gestión de usuarios, empresas, ofertas de trabajo, cursos de formación, candidaturas, suscripciones, validaciones y notificaciones.
  title: LABORA - API de Integración
  version: "1.0"
servers:
- url: /
tags:
- description: Gestión de usuarios demandantes de empleo
  name: usuarios
- description: Gestión de empresas registradas en el sistema
  name: empresas
- description: Gestión de ofertas de trabajo publicadas por empresas
  name: ofertas
- description: Gestión de cursos de formación de la plataforma LABORA
  name: cursos
- description: Gestión de candidaturas de demandantes a ofertas de trabajo
  name: candidaturas
- description: Gestión de suscripciones de demandantes a ofertas y cursos por etiquetas
  name: suscripciones
- description: "Validación de datos de usuarios, certificados, etiquetas y elegibilidad"
  name: validacion
- description: Envío y consulta de notificaciones a usuarios y empresas
  name: notificaciones
paths:
  /usuarios:
    get:
      description: Devuelve una lista paginada de usuarios con filtros opcionales
        por tipo y estado.
      operationId: usuariosGET
      parameters:
      - description: Número de página
        explode: true
        in: query
        name: p
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Número de entradas por página
        explode: true
        in: query
        name: s
        required: false
        schema:
          default: 10
          maximum: 50
          type: integer
        style: form
      - description: Orden de los resultados por fecha
        explode: true
        in: query
        name: q
        required: false
        schema:
          default: descendente
          enum:
          - ascendente
          - descendente
          type: string
        style: form
      - description: "Filtrar por nombre, apellidos o email"
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Filtrar por tipo de usuario
        explode: true
        in: query
        name: tipo
        required: false
        schema:
          enum:
          - DEMANDANTE
          - REPRESENTANTE
          - ADMINISTRADOR
          type: string
        style: form
      - description: Filtrar por estado activo/inactivo
        explode: true
        in: query
        name: activo
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioListResponse"
          description: Listado de usuarios obtenido correctamente
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Listar usuarios con filtros opcionales
      tags:
      - usuarios
      x-eov-operation-handler: controllers/UsuariosController
    post:
      description: Registra un nuevo ciudadano en el sistema LABORA como demandante
        de empleo activo.
      operationId: usuariosPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuario creado correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ya existe un usuario con ese NIF/NIE
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Crear un nuevo usuario
      tags:
      - usuarios
      x-eov-operation-handler: controllers/UsuariosController
  /usuarios/{id}:
    delete:
      description: Elimina permanentemente un usuario del sistema.
      operationId: usuariosIdDELETE
      parameters:
      - description: NIF o NIE del usuario
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 12345678A
          type: string
        style: simple
      responses:
        "200":
          description: Usuario eliminado correctamente
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Eliminar un usuario por su NIF/NIE
      tags:
      - usuarios
      x-eov-operation-handler: controllers/UsuariosController
    get:
      description: Devuelve los datos completos de un usuario a partir de su NIF o
        NIE.
      operationId: usuariosIdGET
      parameters:
      - description: NIF o NIE del usuario
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 12345678A
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuario encontrado
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Obtener un usuario por su NIF/NIE
      tags:
      - usuarios
      x-eov-operation-handler: controllers/UsuariosController
    put:
      description: Actualiza los datos de un usuario existente. También se usa para
        activar o desactivar el perfil.
      operationId: usuariosIdPUT
      parameters:
      - description: NIF o NIE del usuario
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 12345678A
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdateInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuario modificado correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Modificar los datos de un usuario
      tags:
      - usuarios
      x-eov-operation-handler: controllers/UsuariosController
  /empresas:
    get:
      description: Devuelve una lista paginada de empresas con filtros opcionales
        por sector y clasificación.
      operationId: empresasGET
      parameters:
      - description: Número de página
        explode: true
        in: query
        name: p
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Número de entradas por página
        explode: true
        in: query
        name: s
        required: false
        schema:
          default: 10
          maximum: 50
          type: integer
        style: form
      - description: Orden de los resultados por fecha
        explode: true
        in: query
        name: q
        required: false
        schema:
          default: descendente
          enum:
          - ascendente
          - descendente
          type: string
        style: form
      - description: Filtrar por nombre o razón social
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Filtrar por sector de actividad
        explode: true
        in: query
        name: sector
        required: false
        schema:
          type: string
        style: form
      - description: Filtrar por clasificación de empresa
        explode: true
        in: query
        name: clasificacion
        required: false
        schema:
          enum:
          - MICRO
          - PEQUEÑA
          - MEDIANA
          - GRANDE
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaListResponse"
          description: Listado de empresas obtenido correctamente
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Listar empresas con filtros opcionales
      tags:
      - empresas
      x-eov-operation-handler: controllers/EmpresasController
    post:
      description: Registra una nueva empresa en el sistema LABORA.
      operationId: empresasPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"
          description: Empresa creada correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Ya existe una empresa con ese CIF
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Crear una nueva empresa
      tags:
      - empresas
      x-eov-operation-handler: controllers/EmpresasController
  /empresas/{cif}:
    delete:
      operationId: empresasCifDELETE
      parameters:
      - description: CIF de la empresa
        explode: false
        in: path
        name: cif
        required: true
        schema:
          example: B12345678
          type: string
        style: simple
      responses:
        "200":
          description: Empresa eliminada correctamente
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Eliminar una empresa por su CIF
      tags:
      - empresas
      x-eov-operation-handler: controllers/EmpresasController
    get:
      description: Devuelve los datos completos de una empresa. Usado en el Flujo
        1 para validar que la empresa está activa antes de publicar una oferta.
      operationId: empresasCifGET
      parameters:
      - description: CIF de la empresa
        explode: false
        in: path
        name: cif
        required: true
        schema:
          example: B12345678
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"
          description: Empresa encontrada
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Obtener una empresa por su CIF
      tags:
      - empresas
      x-eov-operation-handler: controllers/EmpresasController
    put:
      operationId: empresasCifPUT
      parameters:
      - description: CIF de la empresa
        explode: false
        in: path
        name: cif
        required: true
        schema:
          example: B12345678
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaUpdateInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"
          description: Empresa modificada correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Modificar los datos de una empresa
      tags:
      - empresas
      x-eov-operation-handler: controllers/EmpresasController
  /ofertas:
    get:
      description: Devuelve una lista paginada de ofertas. Permite filtrar por etiquetas
        para el matching y las suscripciones.
      operationId: ofertasGET
      parameters:
      - description: Número de página
        explode: true
        in: query
        name: p
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Número de entradas por página
        explode: true
        in: query
        name: s
        required: false
        schema:
          default: 10
          maximum: 50
          type: integer
        style: form
      - description: Orden de los resultados por fecha
        explode: true
        in: query
        name: q
        required: false
        schema:
          default: descendente
          enum:
          - ascendente
          - descendente
          type: string
        style: form
      - description: Filtrar por título o descripción
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Filtrar por etiquetas separadas por comas
        explode: true
        in: query
        name: etiquetas
        required: false
        schema:
          example: "informatica,programacion"
          type: string
        style: form
      - description: Filtrar por estado de la oferta
        explode: true
        in: query
        name: estado
        required: false
        schema:
          enum:
          - ACTIVA
          - CERRADA
          - PAUSADA
          type: string
        style: form
      - description: Filtrar por empresa publicadora
        explode: true
        in: query
        name: cif_empresa
        required: false
        schema:
          example: B12345678
          type: string
        style: form
      - description: Filtrar por tipo de contrato
        explode: true
        in: query
        name: duracion_contrato
        required: false
        schema:
          enum:
          - INDEFINIDO
          - TEMPORAL
          - ALTERNANCIA
          - PRACTICAS
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfertaListResponse"
          description: Listado de ofertas obtenido correctamente
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Listar ofertas filtradas por etiquetas y otros criterios
      tags:
      - ofertas
      x-eov-operation-handler: controllers/OfertasController
    post:
      description: Crea y publica una oferta de trabajo. Usado en el Flujo 1 tras
        validar la empresa.
      operationId: ofertasPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfertaInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
          description: Oferta creada correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: No existe ninguna empresa con ese CIF
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Publicar una nueva oferta de trabajo
      tags:
      - ofertas
      x-eov-operation-handler: controllers/OfertasController
  /ofertas/{id}:
    delete:
      operationId: ofertasIdDELETE
      parameters:
      - description: Identificador único de la oferta
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: OFE-2026-001
          type: string
        style: simple
      responses:
        "200":
          description: Oferta eliminada correctamente
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Eliminar una oferta por su ID
      tags:
      - ofertas
      x-eov-operation-handler: controllers/OfertasController
    get:
      description: Devuelve los datos de una oferta. Usado en el Flujo 2 para obtener
        los requisitos antes de validar la candidatura.
      operationId: ofertasIdGET
      parameters:
      - description: Identificador único de la oferta
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: OFE-2026-001
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
          description: Oferta encontrada
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Obtener una oferta por su ID
      tags:
      - ofertas
      x-eov-operation-handler: controllers/OfertasController
    put:
      operationId: ofertasIdPUT
      parameters:
      - description: Identificador único de la oferta
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: OFE-2026-001
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfertaUpdateInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Oferta"
          description: Oferta modificada correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Modificar los datos de una oferta
      tags:
      - ofertas
      x-eov-operation-handler: controllers/OfertasController
  /cursos:
    get:
      description: Devuelve el catálogo de cursos disponibles. Usado en el Flujo 5
        para que el demandante consulte las etiquetas disponibles antes de suscribirse.
      operationId: cursosGET
      parameters:
      - description: Número de página
        explode: true
        in: query
        name: p
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Número de entradas por página
        explode: true
        in: query
        name: s
        required: false
        schema:
          default: 10
          maximum: 50
          type: integer
        style: form
      - description: Filtrar por estado del curso
        explode: true
        in: query
        name: estado
        required: false
        schema:
          enum:
          - activo
          - inactivo
          - finalizado
          type: string
        style: form
      - description: Filtrar por etiqueta asociada al curso
        explode: true
        in: query
        name: etiqueta
        required: false
        schema:
          example: informatica
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoListResponse"
          description: Listado de cursos obtenido correctamente
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Listar cursos con filtros opcionales
      tags:
      - cursos
      x-eov-operation-handler: controllers/CursosController
    post:
      operationId: cursosPOST
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
          description: Curso creado correctamente
        "400":
          content:
            application/json:
              example:
                mensaje: Los datos introducidos son incorrectos
              schema:
                $ref: "#/components/schemas/Error"
          description: Los datos introducidos son incorrectos
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Crear un nuevo curso de formación
      tags:
      - cursos
      x-eov-operation-handler: controllers/CursosController
  /cursos/{id}:
    delete:
      operationId: cursosIdDELETE
      parameters:
      - description: Identificador único del curso
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 1
          type: integer
        style: simple
      responses:
        "204":
          description: Curso eliminado correctamente
        "404":
          content:
            application/json:
              example:
                mensaje: El recurso solicitado no existe
              schema:
                $ref: "#/components/schemas/Error"
          description: El recurso solicitado no existe
        "500":
          content:
            application/json:
              example:
                mensaje: Error interno del servidor
              schema:
                $ref: "#/components/schemas/Error"
          description: Error interno del servidor
      summary: Eliminar un curso por su ID
      tags:
      - cursos
