openapi: '3.0.3'
info:
  title: LABORA - API de Integración
  version: '1.0'
  description: >
    Contrato REST unificado del sistema LABORA (Servicio Público de Empleo de la Comunitat Valenciana).
    Incluye la gestión de usuarios, empresas, ofertas de trabajo, cursos de formación,
    candidaturas, suscripciones, validaciones y notificaciones.

tags:
  - name: usuarios
    description: Gestión de usuarios demandantes de empleo
  - name: empresas
    description: Gestión de empresas registradas en el sistema
  - name: ofertas
    description: Gestión de ofertas de trabajo publicadas por empresas
  - name: cursos
    description: Gestión de cursos de formación de la plataforma LABORA
  - name: candidaturas
    description: Gestión de candidaturas de demandantes a ofertas de trabajo
  - name: suscripciones
    description: Gestión de suscripciones de demandantes a ofertas y cursos por etiquetas
  - name: validacion
    description: Validación de datos de usuarios, certificados, etiquetas y elegibilidad
  - name: notificaciones
    description: Envío y consulta de notificaciones a usuarios y empresas

paths:

  # ─────────────────────────────────────────
  # USUARIOS
  # ─────────────────────────────────────────

  /usuarios:
    post:
      tags:
        - usuarios
      summary: Crear un nuevo usuario
      description: Registra un nuevo ciudadano en el sistema LABORA como demandante de empleo activo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe un usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - usuarios
      summary: Listar usuarios con filtros opcionales
      description: Devuelve una lista paginada de usuarios con filtros opcionales por tipo y estado.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
        - name: search
          in: query
          description: Filtrar por nombre, apellidos o email
          schema:
            type: string
        - name: tipo
          in: query
          description: Filtrar por tipo de usuario
          schema:
            type: string
            enum: [DEMANDANTE, REPRESENTANTE, ADMINISTRADOR]
        - name: activo
          in: query
          description: Filtrar por estado activo/inactivo
          schema:
            type: boolean
      responses:
        '200':
          description: Listado de usuarios obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /usuarios/{id}:
    get:
      tags:
        - usuarios
      summary: Obtener un usuario por su NIF/NIE
      description: Devuelve los datos completos de un usuario a partir de su NIF o NIE.
      parameters:
        - $ref: '#/components/parameters/IdNIFNIE'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - usuarios
      summary: Modificar los datos de un usuario
      description: Actualiza los datos de un usuario existente. También se usa para activar o desactivar el perfil.
      parameters:
        - $ref: '#/components/parameters/IdNIFNIE'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '200':
          description: Usuario modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - usuarios
      summary: Eliminar un usuario por su NIF/NIE
      description: Elimina permanentemente un usuario del sistema.
      parameters:
        - $ref: '#/components/parameters/IdNIFNIE'
      responses:
        '200':
          description: Usuario eliminado correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # EMPRESAS
  # ─────────────────────────────────────────

  /empresas:
    post:
      tags:
        - empresas
      summary: Crear una nueva empresa
      description: Registra una nueva empresa en el sistema LABORA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '201':
          description: Empresa creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe una empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - empresas
      summary: Listar empresas con filtros opcionales
      description: Devuelve una lista paginada de empresas con filtros opcionales por sector y clasificación.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
        - name: search
          in: query
          description: Filtrar por nombre o razón social
          schema:
            type: string
        - name: sector
          in: query
          description: Filtrar por sector de actividad
          schema:
            type: string
        - name: clasificacion
          in: query
          description: Filtrar por clasificación de empresa
          schema:
            type: string
            enum: [MICRO, PEQUEÑA, MEDIANA, GRANDE]
      responses:
        '200':
          description: Listado de empresas obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /empresas/{cif}:
    get:
      tags:
        - empresas
      summary: Obtener una empresa por su CIF
      description: Devuelve los datos completos de una empresa. Usado en el Flujo 1 para validar que la empresa está activa antes de publicar una oferta.
      parameters:
        - $ref: '#/components/parameters/IdCIF'
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - empresas
      summary: Modificar los datos de una empresa
      parameters:
        - $ref: '#/components/parameters/IdCIF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '200':
          description: Empresa modificada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - empresas
      summary: Eliminar una empresa por su CIF
      parameters:
        - $ref: '#/components/parameters/IdCIF'
      responses:
        '200':
          description: Empresa eliminada correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # OFERTAS
  # ─────────────────────────────────────────

  /ofertas:
    post:
      tags:
        - ofertas
      summary: Publicar una nueva oferta de trabajo
      description: Crea y publica una oferta de trabajo. Usado en el Flujo 1 tras validar la empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaInput'
      responses:
        '201':
          description: Oferta creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No existe ninguna empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - ofertas
      summary: Listar ofertas filtradas por etiquetas y otros criterios
      description: Devuelve una lista paginada de ofertas. Permite filtrar por etiquetas para el matching y las suscripciones.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - $ref: '#/components/parameters/Orden'
        - name: search
          in: query
          description: Filtrar por título o descripción
          schema:
            type: string
        - name: etiquetas
          in: query
          description: Filtrar por etiquetas separadas por comas
          schema:
            type: string
            example: "informatica,programacion"
        - name: estado
          in: query
          description: Filtrar por estado de la oferta
          schema:
            type: string
            enum: [ACTIVA, CERRADA, PAUSADA]
        - name: cif_empresa
          in: query
          description: Filtrar por empresa publicadora
          schema:
            type: string
            example: "B12345678"
        - name: duracion_contrato
          in: query
          description: Filtrar por tipo de contrato
          schema:
            type: string
            enum: [INDEFINIDO, TEMPORAL, ALTERNANCIA, PRACTICAS]
      responses:
        '200':
          description: Listado de ofertas obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /ofertas/{id}:
    get:
      tags:
        - ofertas
      summary: Obtener una oferta por su ID
      description: Devuelve los datos de una oferta. Usado en el Flujo 2 para obtener los requisitos antes de validar la candidatura.
      parameters:
        - $ref: '#/components/parameters/IdOferta'
      responses:
        '200':
          description: Oferta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - ofertas
      summary: Modificar los datos de una oferta
      parameters:
        - $ref: '#/components/parameters/IdOferta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaInput'
      responses:
        '200':
          description: Oferta modificada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - ofertas
      summary: Eliminar una oferta por su ID
      parameters:
        - $ref: '#/components/parameters/IdOferta'
      responses:
        '200':
          description: Oferta eliminada correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # CURSOS
  # ─────────────────────────────────────────

  /cursos:
    post:
      tags:
        - cursos
      summary: Crear un nuevo curso de formación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoInput'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - cursos
      summary: Listar cursos con filtros opcionales
      description: Devuelve el catálogo de cursos disponibles. Usado en el Flujo 5 para que el demandante consulte las etiquetas disponibles antes de suscribirse.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - name: estado
          in: query
          description: Filtrar por estado del curso
          schema:
            type: string
            enum: [activo, inactivo, finalizado]
        - name: etiqueta
          in: query
          description: Filtrar por etiqueta asociada al curso
          schema:
            type: string
            example: "informatica"
      responses:
        '200':
          description: Listado de cursos obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /cursos/{id}:
    get:
      tags:
        - cursos
      summary: Obtener un curso por su ID
      parameters:
        - $ref: '#/components/parameters/IdCurso'
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - cursos
      summary: Modificar los datos de un curso
      parameters:
        - $ref: '#/components/parameters/IdCurso'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoInput'
      responses:
        '200':
          description: Curso modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - cursos
      summary: Eliminar un curso por su ID
      parameters:
        - $ref: '#/components/parameters/IdCurso'
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # CANDIDATURAS
  # ─────────────────────────────────────────

  /candidaturas:
    post:
      tags:
        - candidaturas
      summary: Registrar una nueva candidatura
      description: Registra la candidatura de un demandante a una oferta de trabajo. Usado en el Flujo 2 tras verificar la elegibilidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidaturaInput'
      responses:
        '201':
          description: Candidatura registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidatura'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El demandante ya tiene una candidatura activa para esta oferta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - candidaturas
      summary: Listar candidaturas con filtros opcionales
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - name: id_oferta
          in: query
          description: Filtrar candidaturas por oferta
          schema:
            type: string
            example: "OFE-2026-001"
        - name: id_candidato
          in: query
          description: Filtrar candidaturas por candidato
          schema:
            type: string
            example: "12345678A"
        - name: estado
          in: query
          description: Filtrar por estado de la candidatura
          schema:
            type: string
            enum: [PENDIENTE, PRESELECCIONADO, RECHAZADO, ACEPTADO]
      responses:
        '200':
          description: Listado de candidaturas obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidaturaListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /candidaturas/{id}:
    get:
      tags:
        - candidaturas
      summary: Obtener una candidatura por su ID
      parameters:
        - $ref: '#/components/parameters/IdCandidatura'
      responses:
        '200':
          description: Candidatura encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidatura'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - candidaturas
      summary: Modificar el estado de una candidatura
      description: Permite actualizar el estado de una candidatura. Usado para marcar una candidatura como aceptada o rechazada.
      parameters:
        - $ref: '#/components/parameters/IdCandidatura'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidaturaInput'
      responses:
        '200':
          description: Candidatura modificada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidatura'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - candidaturas
      summary: Eliminar una candidatura por su ID
      parameters:
        - $ref: '#/components/parameters/IdCandidatura'
      responses:
        '204':
          description: Candidatura eliminada correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # SUSCRIPCIONES
  # ─────────────────────────────────────────

  /suscripciones:
    post:
      tags:
        - suscripciones
      summary: Registrar una nueva suscripción
      description: Registra las preferencias de un demandante por etiquetas para recibir notificaciones de nuevas ofertas o cursos. Usado en el Flujo 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionInput'
      responses:
        '201':
          description: Suscripción registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suscripcion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No existe ningún usuario con ese NIF/NIE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - suscripciones
      summary: Listar suscripciones con filtros opcionales
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/TamanoPagina'
        - name: id_usuario
          in: query
          description: Filtrar suscripciones por usuario
          schema:
            type: string
            example: "12345678A"
        - name: tipo
          in: query
          description: Filtrar por tipo de suscripción
          schema:
            type: string
            enum: [OFERTA, CURSO]
      responses:
        '200':
          description: Listado de suscripciones obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /suscripciones/{id}:
    get:
      tags:
        - suscripciones
      summary: Obtener una suscripción por su ID
      parameters:
        - $ref: '#/components/parameters/IdSuscripcion'
      responses:
        '200':
          description: Suscripción encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suscripcion'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - suscripciones
      summary: Eliminar una suscripción por su ID
      description: Cancela una suscripción activa del demandante.
      parameters:
        - $ref: '#/components/parameters/IdSuscripcion'
      responses:
        '200':
          description: Suscripción eliminada correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # VALIDACION
  # ─────────────────────────────────────────

  /validacion/usuarios:
    post:
      tags:
        - validacion
      summary: Validar datos de un usuario
      description: Valida el formato y completitud de los datos de un nuevo usuario antes de su registro. Usado en el Flujo 4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionUsuarioInput'
      responses:
        '200':
          description: Validación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /validacion/certificados:
    post:
      tags:
        - validacion
      summary: Validar tipo de certificado solicitado
      description: Verifica que el tipo de certificado solicitado existe y es válido para el demandante. Usado en el Flujo 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionCertificadoInput'
      responses:
        '200':
          description: Validación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: El tipo de certificado no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /validacion/etiquetas:
    post:
      tags:
        - validacion
      summary: Validar etiquetas de suscripción
      description: Verifica que las etiquetas seleccionadas por el demandante existen en el sistema. Usado en el Flujo 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionEtiquetasInput'
      responses:
        '200':
          description: Validación realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /validacion/elegibilidad:
    post:
      tags:
        - validacion
      summary: Validar elegibilidad de un demandante para una oferta
      description: Verifica si un demandante cumple los requisitos de una oferta de trabajo antes de registrar su candidatura. Usado en el Flujo 2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionElegibilidadInput'
      responses:
        '200':
          description: Validación de elegibilidad realizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No existe el usuario o la oferta indicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────
  # NOTIFICACIONES
  # ─────────────────────────────────────────

  /notificaciones:
    post:
      tags:
        - notificaciones
      summary: Enviar una nueva notificación
      description: Envía una notificación a una lista de destinatarios. Usado transversalmente en todos los flujos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionInput'
      responses:
        '201':
          description: Notificación procesada y encolada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /notificaciones/{id}:
    get:
      tags:
        - notificaciones
      summary: Obtener el estado de una notificación por su ID
      parameters:
        - $ref: '#/components/parameters/IdNotificacion'
      responses:
        '200':
          description: Estado de la notificación obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ─────────────────────────────────────────
# COMPONENTES REUTILIZABLES
# ─────────────────────────────────────────

components:

  # ── PARÁMETROS REUTILIZABLES ──────────────

  parameters:

    Pagina:
      name: p
      in: query
      description: Número de página
      schema:
        type: integer
        default: 1
        minimum: 1

    TamanoPagina:
      name: s
      in: query
      description: Número de entradas por página
      schema:
        type: integer
        default: 10
        maximum: 50

    Orden:
      name: q
      in: query
      description: Orden de los resultados por fecha
      schema:
        type: string
        enum: [ascendente, descendente]
        default: descendente

    IdNIFNIE:
      name: id
      in: path
      required: true
      description: NIF o NIE del usuario
      schema:
        type: string
        example: "12345678A"

    IdCIF:
      name: cif
      in: path
      required: true
      description: CIF de la empresa
      schema:
        type: string
        example: "B12345678"

    IdOferta:
      name: id
      in: path
      required: true
      description: Identificador único de la oferta
      schema:
        type: string
        example: "OFE-2026-001"

    IdCurso:
      name: id
      in: path
      required: true
      description: Identificador único del curso
      schema:
        type: integer
        example: 1

    IdCandidatura:
      name: id
      in: path
      required: true
      description: Identificador único de la candidatura
      schema:
        type: integer
        example: 1

    IdSuscripcion:
      name: id
      in: path
      required: true
      description: Identificador único de la suscripción
      schema:
        type: integer
        example: 1

    IdNotificacion:
      name: id
      in: path
      required: true
      description: Identificador único de la notificación
      schema:
        type: integer
        example: 10458

  # ── RESPUESTAS REUTILIZABLES ──────────────

  responses:

    BadRequest:
      description: Los datos introducidos son incorrectos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: "Los datos introducidos son incorrectos"

    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: "El recurso solicitado no existe"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: "Error interno del servidor"

  # ── SCHEMAS ───────────────────────────────

  schemas:

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "Descripción del error ocurrido"

    # ── USUARIOS ──

    UsuarioInput:
      type: object
      description: Datos necesarios para crear o modificar un usuario
      required:
        - id_nie
        - nombre
        - apellidos
        - email
        - tipo
      properties:
        id_nie:
          type: string
          description: NIF o NIE del usuario (identificador único)
          example: "12345678A"
        nombre:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "García López"
        email:
          type: string
          format: email
          example: "maria.garcia@email.com"
        tipo:
          type: string
          enum: [DEMANDANTE, REPRESENTANTE, ADMINISTRADOR]
          example: "DEMANDANTE"
        activo:
          type: boolean
          default: true

    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioInput'
      description: Usuario completo tal como se almacena en el sistema

    UsuarioListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 120
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'

    # ── EMPRESAS ──

    EmpresaInput:
      type: object
      description: Datos necesarios para crear o modificar una empresa
      required:
        - cif
        - nombre
        - razon_social
        - correo
        - telefono
        - fecha_constitucion
        - sector
        - clasificacion
      properties:
        cif:
          type: string
          example: "B12345678"
        nombre:
          type: string
          example: "TechSolutions SL"
        razon_social:
          type: string
          example: "TechSolutions Sociedad Limitada"
        correo:
          type: string
          format: email
          example: "contacto@techsolutions.es"
        telefono:
          type: string
          example: "965123456"
        fecha_constitucion:
          type: string
          format: date
          example: "2010-03-15"
        sector:
          type: string
          example: "Tecnología"
        clasificacion:
          type: string
          enum: [MICRO, PEQUEÑA, MEDIANA, GRANDE]
          example: "PEQUEÑA"

    Empresa:
      allOf:
        - $ref: '#/components/schemas/EmpresaInput'
      description: Empresa completa tal como se almacena en el sistema

    EmpresaListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 45
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Empresa'

    # ── OFERTAS ──

    OfertaInput:
      type: object
      description: Datos necesarios para crear o modificar una oferta de trabajo
      required:
        - cif_empresa
        - titulo
        - descripcion
        - duracion_contrato
        - etiquetas
      properties:
        cif_empresa:
          type: string
          example: "B12345678"
        titulo:
          type: string
          example: "Desarrollador Full Stack"
        descripcion:
          type: string
          example: "Buscamos desarrollador con experiencia en React y Node.js"
        duracion_contrato:
          type: string
          enum: [INDEFINIDO, TEMPORAL, ALTERNANCIA, PRACTICAS]
          example: "INDEFINIDO"
        estado:
          type: string
          enum: [ACTIVA, CERRADA, PAUSADA]
          default: ACTIVA
          example: "ACTIVA"
        etiquetas:
          type: array
          items:
            type: string
          example: ["informatica", "programacion", "fullstack"]
        fecha_publicacion:
          type: string
          format: date
          example: "2026-05-14"

    Oferta:
      allOf:
        - $ref: '#/components/schemas/OfertaInput'
      description: Oferta completa tal como se almacena en el sistema
      properties:
        id:
          type: string
          example: "OFE-2026-001"

    OfertaListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 80
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Oferta'

    # ── CURSOS ──

    CursoInput:
      type: object
      required:
        - titulo
        - descripcion
        - fecha_inicio
        - fecha_fin
      properties:
        titulo:
          type: string
          example: "Introducción a la programación"
        descripcion:
          type: string
          example: "Curso básico de programación orientado a desempleados"
        fecha_inicio:
          type: string
          format: date
          example: "2026-05-14"
        fecha_fin:
          type: string
          format: date
          example: "2026-12-31"
        etiquetas:
          type: array
          items:
            type: string
          example: ["informatica", "programacion"]

    Curso:
      allOf:
        - $ref: '#/components/schemas/CursoInput'
      description: Curso completo tal como se almacena en el sistema
      properties:
        id:
          type: integer
          example: 1
        estado:
          type: string
          enum: [activo, inactivo, finalizado]
          example: "activo"

    CursoListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 45
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Curso'

    # ── CANDIDATURAS ──

    CandidaturaInput:
      type: object
      description: Datos necesarios para registrar una candidatura
      required:
        - id_candidato
        - id_oferta
      properties:
        id_candidato:
          type: string
          description: NIF/NIE del demandante candidato
          example: "12345678A"
        id_oferta:
          type: string
          description: Identificador de la oferta a la que se aplica
          example: "OFE-2026-001"
        estado:
          type: string
          description: Estado de la candidatura
          enum: [PENDIENTE, PRESELECCIONADO, RECHAZADO, ACEPTADO]
          default: PENDIENTE
          example: "PENDIENTE"
        fecha_aplicacion:
          type: string
          format: date
          description: Fecha en la que se registra la candidatura
          example: "2026-05-14"

    Candidatura:
      allOf:
        - $ref: '#/components/schemas/CandidaturaInput'
      description: Candidatura completa tal como se almacena en el sistema
      properties:
        id:
          type: integer
          example: 1

    CandidaturaListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 45
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Candidatura'

    # ── SUSCRIPCIONES ──

    SuscripcionInput:
      type: object
      description: Datos necesarios para registrar una suscripción de un demandante
      required:
        - id_usuario
        - tipo
        - etiquetas
      properties:
        id_usuario:
          type: string
          description: NIF/NIE del demandante que se suscribe
          example: "12345678A"
        tipo:
          type: string
          description: Tipo de suscripción (a ofertas de trabajo o a cursos de formación)
          enum: [OFERTA, CURSO]
          example: "OFERTA"
        etiquetas:
          type: array
          description: Lista de etiquetas de interés seleccionadas por el demandante
          items:
            type: string
          example: ["informatica", "programacion"]

    Suscripcion:
      allOf:
        - $ref: '#/components/schemas/SuscripcionInput'
      description: Suscripción completa tal como se almacena en el sistema
      properties:
        id:
          type: integer
          example: 1
        fecha_suscripcion:
          type: string
          format: date
          example: "2026-05-14"
        activa:
          type: boolean
          default: true

    SuscripcionListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 10
        pagina:
          type: integer
          example: 1
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/Suscripcion'

    # ── VALIDACION ──

    ValidacionUsuarioInput:
      type: object
      description: Datos del usuario a validar antes del registro
      required:
        - id_nie
        - nombre
        - apellidos
        - email
      properties:
        id_nie:
          type: string
          example: "12345678A"
        nombre:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "García López"
        email:
          type: string
          format: email
          example: "maria.garcia@email.com"

    ValidacionCertificadoInput:
      type: object
      description: Datos del certificado a validar antes de su generación
      required:
        - id_usuario
        - tipo_certificado
      properties:
        id_usuario:
          type: string
          description: NIF/NIE del demandante solicitante
          example: "12345678A"
        tipo_certificado:
          type: string
          description: Tipo de certificado solicitado
          example: "CERTIFICADO_PROFESIONALIDAD"
        motivo:
          type: string
          description: Motivo de la solicitud del certificado
          example: "Acreditación para proceso de selección"

    ValidacionEtiquetasInput:
      type: object
      description: Lista de etiquetas a validar antes de registrar una suscripción
      required:
        - etiquetas
      properties:
        etiquetas:
          type: array
          items:
            type: string
          example: ["informatica", "programacion"]

    ValidacionElegibilidadInput:
      type: object
      description: Datos para verificar si un demandante es elegible para una oferta
      required:
        - id_usuario
        - id_oferta
      properties:
        id_usuario:
          type: string
          description: NIF/NIE del demandante candidato
          example: "12345678A"
        id_oferta:
          type: string
          description: Identificador de la oferta
          example: "OFE-2026-001"

    ValidacionResponse:
      type: object
      description: Resultado de cualquier operación de validación
      properties:
        valido:
          type: boolean
          description: Indica si la validación ha sido satisfactoria
          example: true
        motivo:
          type: string
          description: Descripción del resultado o motivo del rechazo si no es válido
          example: "Todos los datos son correctos"

    # ── NOTIFICACIONES ──

    NotificacionInput:
      type: object
      description: Datos necesarios para enviar una notificación
      required:
        - destinatarios
        - asunto
        - mensaje
      properties:
        destinatarios:
          type: array
          items:
            type: string
            format: email
          example: ["usuario1@email.com", "empresa2@email.com"]
        asunto:
          type: string
          example: "Resultado de su solicitud de certificado LABORA"
        mensaje:
          type: string
          example: "Su certificado ha sido generado correctamente y ya puede descargarlo."
        tipo:
          type: string
          enum: [OFERTA, CERTIFICADO, ESTADO_CANDIDATURA, SUSCRIPCION, ALERTA]
          example: "CERTIFICADO"

    Notificacion:
      allOf:
        - $ref: '#/components/schemas/NotificacionInput'
      description: Notificación completa tal como se registra en el sistema
      properties:
        id:
          type: integer
          example: 10458
        estado:
          type: string
          enum: [PENDIENTE, ENVIADO, ERROR]
          default: PENDIENTE
          example: "ENVIADO"
        fecha_envio:
          type: string
          format: date-time
          example: "2026-05-14T19:45:00Z"
