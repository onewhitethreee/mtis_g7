openapi: '3.0.3'
info:
  title: LABORA - Servicio de Notificaciones
  version: '1.0'
  description: Contrato REST para el envío y gestión de notificaciones administrativas en el sistema LABORA.

paths:

  /notificaciones:
    post:
      tags:
        - notificaciones
      summary: Enviar una nueva notificación
      description: Envía una notificación a partir de una lista de correos electrónicos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionInput'
      responses:
        '201':
          description: Notificación procesada y encolada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          description: Los datos introducidos son incorrectos (ej. lista de correos vacía o sin formato válido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

  /notificaciones/{id}:
    get:
      tags:
        - notificaciones
      summary: Obtener el estado de una notificación por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la notificación
          schema:
            type: integer
            example: 10458
      responses:
        '200':
          description: Estado de la notificación obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '404':
          description: No existe ninguna notificación con ese ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

components:
  schemas:

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "No existe ninguna notificación con ese ID"

    NotificacionInput:
      type: object
      description: Datos necesarios para enviar una notificación
      required:
        - destinatarios
        - asunto
        - mensaje
      properties:
        destinatarios:
          type: array
          description: Lista de correos electrónicos a los que enviar la notificación
          items:
            type: string
            format: email
          example: ["usuario1@email.com", "empresa2@email.com"]
        asunto:
          type: string
          description: Asunto de la notificación
          example: "Resultado de su solicitud de certificado LABORA"
        mensaje:
          type: string
          description: Contenido de la notificación
          example: "Le informamos que su certificado ha sido generado correctamente y ya puede descargarlo."
        tipo:
          type: string
          description: Categoría de la notificación para su clasificación interna
          enum: [OFERTA, CERTIFICADO, ESTADO_CANDIDATURA, ALERTA]
          example: "CERTIFICADO"

    Notificacion:
      allOf:
        - $ref: '#/components/schemas/NotificacionInput'
      description: Notificación completa tal como se registra en el sistema de envíos
      properties:
        id:
          type: integer
          description: Identificador único de la notificación generada
          example: 10458
        estado:
          type: string
          description: Estado actual del envío
          enum: [PENDIENTE, ENVIADO, ERROR]
          default: PENDIENTE
          example: "ENVIADO"
        fecha_envio:
          type: string
          format: date-time
          description: Fecha y hora en la que se encoló o envió la notificación
          example: "2026-05-14T19:45:00Z"