openapi: '3.0.3'
info:
  title: LABORA - Servicio de Empresas
  version: '1.0'
  description: Contrato REST para la gestión de empresas en el sistema LABORA.

paths:

  /empresas:
    post:
      tags:
        - empresas
      summary: Crear una nueva empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '201':
          description: Empresa creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          description: Los datos introducidos son incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    get:
      tags:
        - empresas
      summary: Listar empresas con filtros opcionales
      parameters:
        - name: p
          in: query
          description: Número de página
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: s
          in: query
          description: Número de entradas por página
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: q
          in: query
          description: Orden por fecha de constitución
          schema:
            type: string
            enum: [ascendente, descendente]
            default: descendente
        - name: search
          in: query
          description: Filtrar por nombre o razón social
          schema:
            type: string
        - name: sector
          in: query
          description: Filtrar por sector de actividad
          schema:
            type: string
        - name: clasificacion
          in: query
          description: Filtrar por clasificación de empresa
          schema:
            type: string
            enum: [MICRO, PEQUEÑA, MEDIANA, GRANDE]
      responses:
        '200':
          description: Listado de empresas obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total de resultados encontrados
                  pagina:
                    type: integer
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/Empresa'
        '500':
          description: Error interno del servidor

  /empresas/{cif}:
    get:
      tags:
        - empresas
      summary: Obtener una empresa por su CIF
      parameters:
        - name: cif
          in: path
          required: true
          description: CIF de la empresa
          schema:
            type: string
            example: "B12345678"
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '404':
          description: No existe ninguna empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    put:
      tags:
        - empresas
      summary: Modificar los datos de una empresa
      parameters:
        - name: cif
          in: path
          required: true
          description: CIF de la empresa
          schema:
            type: string
            example: "B12345678"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '200':
          description: Empresa modificada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          description: Los datos introducidos son incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe ninguna empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

    delete:
      tags:
        - empresas
      summary: Eliminar una empresa por su CIF
      parameters:
        - name: cif
          in: path
          required: true
          description: CIF de la empresa
          schema:
            type: string
            example: "B12345678"
      responses:
        '200':
          description: Empresa eliminada correctamente
        '404':
          description: No existe ninguna empresa con ese CIF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor

components:
  schemas:

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "No existe ninguna empresa con ese CIF"

    EmpresaInput:
      type: object
      description: Datos necesarios para crear o modificar una empresa
      required:
        - cif
        - nombre
        - razon_social
        - correo
        - telefono
        - fecha_constitucion
        - sector
        - clasificacion
      properties:
        cif:
          type: string
          description: CIF de la empresa (identificador único)
          example: "B12345678"
        nombre:
          type: string
          description: Nombre comercial de la empresa
          example: "TechSolutions SL"
        razon_social:
          type: string
          description: Razón social de la empresa
          example: "TechSolutions Sociedad Limitada"
        correo:
          type: string
          format: email
          description: Correo electrónico de contacto
          example: "contacto@techsolutions.es"
        telefono:
          type: string
          description: Teléfono de contacto
          example: "965123456"
        fecha_constitucion:
          type: string
          format: date
          description: Fecha de constitución de la empresa
          example: "2010-03-15"
        sector:
          type: string
          description: Sector de actividad de la empresa
          example: "Tecnología"
        clasificacion:
          type: string
          description: Clasificación de la empresa según tamaño
          enum: [MICRO, PEQUEÑA, MEDIANA, GRANDE]
          example: "PEQUEÑA"

    Empresa:
      allOf:
        - $ref: '#/components/schemas/EmpresaInput'
      description: Empresa completa tal como se almacena en el sistema
