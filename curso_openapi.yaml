openapi: 3.0.3
info:
  title: LABORA - Servicio de Cursos
  description: API REST para la gestión de cursos de formación de la plataforma LABORA.
  version: 1.0.0

tags:
  - name: Cursos
    description: Operaciones sobre cursos de formación

paths:
  /cursos:
    get:
      tags:
        - Cursos
      summary: Listar cursos
      description: Devuelve la lista de cursos, con filtros opcionales por estado y etiqueta.
      operationId: listarCursos
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado del curso
          schema:
            type: string
            enum: [activo, inactivo, finalizado]
          example: activo
        - name: etiqueta
          in: query
          required: false
          description: Filtrar por etiqueta asociada al curso
          schema:
            type: string
          example: informatica
        - name: page
          in: query
          required: false
          description: Número de página (paginación)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: Número de resultados por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Lista de cursos obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoListResponse"
              example:
                data:
                  - id: 1
                    titulo: "Introducción a la programación"
                    descripcion: "Curso básico de programación"
                    fecha_inicio: "2026-05-14"
                    fecha_fin: "2026-12-31"
                    estado: "activo"
                    etiquetas: ["informatica", "programacion"]
                message: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Cursos
      summary: Crear curso
      description: Crea un nuevo curso de formación en la plataforma.
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoInput"
            example:
              titulo: "Introducción a la programación"
              descripcion: "Curso básico de programación orientado a desempleados"
              fecha_inicio: "2026-05-14"
              fecha_fin: "2026-12-31"
              etiquetas: ["informatica", "programacion"]
      responses:
        "201":
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoResponse"
              example:
                data:
                  id: 1
                  titulo: "Introducción a la programación"
                  descripcion: "Curso básico de programación orientado a desempleados"
                  fecha_inicio: "2026-05-14"
                  fecha_fin: "2026-12-31"
                  estado: "activo"
                  etiquetas: ["informatica", "programacion"]
                message: "Curso creado correctamente"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único del curso
        schema:
          type: integer
        example: 1

    get:
      tags:
        - Cursos
      summary: Obtener curso
      description: Devuelve los datos de un curso concreto por su id.
      operationId: obtenerCurso
      responses:
        "200":
          description: Curso obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoResponse"
              example:
                data:
                  id: 1
                  titulo: "Introducción a la programación"
                  descripcion: "Curso básico de programación orientado a desempleados"
                  fecha_inicio: "2026-05-14"
                  fecha_fin: "2026-12-31"
                  estado: "activo"
                  etiquetas: ["informatica", "programacion"]
                message: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Cursos
      summary: Modificar curso
      description: Actualiza todos los datos de un curso existente.
      operationId: modificarCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoInput"
            example:
              titulo: "Introducción a la programación (actualizado)"
              descripcion: "Curso básico de programación orientado a desempleados"
              fecha_inicio: "2026-05-14"
              fecha_fin: "2026-12-31"
              etiquetas: ["informatica", "programacion", "python"]
      responses:
        "200":
          description: Curso modificado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoResponse"
              example:
                data:
                  id: 1
                  titulo: "Introducción a la programación (actualizado)"
                  descripcion: "Curso básico de programación orientado a desempleados"
                  fecha_inicio: "2026-05-14"
                  fecha_fin: "2026-12-31"
                  estado: "activo"
                  etiquetas: ["informatica", "programacion", "python"]
                message: "Curso modificado correctamente"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Cursos
      summary: Eliminar curso
      description: Elimina un curso de la plataforma por su id.
      operationId: eliminarCurso
      responses:
        "204":
          description: Curso eliminado correctamente
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Curso:
      type: object
      properties:
        id:
          type: integer
          description: Identificador único autogenerado
          example: 1
        titulo:
          type: string
          description: Título del curso
          example: "Introducción a la programación"
        descripcion:
          type: string
          description: Descripción detallada del curso
          example: "Curso básico de programación orientado a desempleados"
        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio del curso
          example: "2026-05-14"
        fecha_fin:
          type: string
          format: date
          description: Fecha de finalización del curso
          example: "2026-12-31"
        estado:
          type: string
          enum: [activo, inactivo, finalizado]
          description: Estado actual del curso
          example: "activo"
        etiquetas:
          type: array
          items:
            type: string
          description: Etiquetas asociadas al curso para suscripciones y notificaciones
          example: ["informatica", "programacion"]

    CursoInput:
      type: object
      required:
        - titulo
        - descripcion
        - fecha_inicio
        - fecha_fin
      properties:
        titulo:
          type: string
          description: Título del curso
          example: "Introducción a la programación"
        descripcion:
          type: string
          description: Descripción detallada del curso
          example: "Curso básico de programación orientado a desempleados"
        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio del curso
          example: "2026-05-14"
        fecha_fin:
          type: string
          format: date
          description: Fecha de finalización del curso
          example: "2026-12-31"
        etiquetas:
          type: array
          items:
            type: string
          description: Etiquetas asociadas al curso
          example: ["informatica", "programacion"]

    CursoResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Curso"
        message:
          type: string
          example: ok

    CursoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Curso"
        message:
          type: string
          example: ok
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 45

    Error:
      type: object
      properties:
        message:
          type: string
          description: Descripción del error
        code:
          type: string
          description: Código interno del error

  responses:
    BadRequest:
      description: Petición inválida, datos incorrectos o faltantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "El campo titulo es obligatorio"
            code: "VALIDATION_ERROR"

    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Token de autenticación inválido o expirado"
            code: "UNAUTHORIZED"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Curso no encontrado"
            code: "NOT_FOUND"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
